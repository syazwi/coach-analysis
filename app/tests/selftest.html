<!doctype html>
<html><head><meta charset="utf-8"><title>CourtSense self-test</title></head>
<body><pre id="out">running…</pre>
<script type="module">
import { makeCalibration, calibrationWorkspace, imageToCalibrationCanvas, calibrationCanvasToImage, applyH } from '../js/court.js';
import { analyze } from '../js/analysis.js';
import { coach, buildPlan } from '../js/coach.js';
import { matchToJSON, matchFromJSON } from '../js/db.js';
import { containSize, setMediaLayout } from '../js/util.js';

const out = document.getElementById('out');
const log = [];
const check = (name, ok, info = '') => log.push(`${ok ? 'PASS' : 'FAIL'} ${name}${info ? ' — ' + info : ''}`);

try {
  // camera behind near baseline: far court appears narrow at the top
  const cal = makeCalibration([[0.38, 0.30], [0.62, 0.30], [0.85, 0.92], [0.15, 0.92]]);
  const back = applyH(cal.toCourt, 0.15, 0.92);
  check('homography round-trip', Math.abs(back[0] - 0) < 1e-6 && Math.abs(back[1] - 44) < 1e-6, back.map(v => v.toFixed(3)).join(','));

  // camera pan/zoom: robustly move the original calibration while ignoring moving-player outliers
  const { applyAffine, calibrationFromTransform, robustSimilarity } = await import('../js/camera.js');
  const cameraMove = [1.025, 0, 0.018, 0, 1.025, -0.012];
  const staticPts = [[0.2, 0.25], [0.5, 0.22], [0.8, 0.28], [0.25, 0.55], [0.52, 0.58], [0.76, 0.62], [0.35, 0.82], [0.7, 0.84]];
  const motionPairs = staticPts.map(from => ({ from, to: applyAffine(cameraMove, ...from) }));
  motionPairs.push({ from: [0.4, 0.4], to: [0.65, 0.2] }, { from: [0.6, 0.6], to: [0.3, 0.75] }); // players, not camera
  const cameraFit = robustSimilarity(motionPairs, 1920, 1080);
  const fitProbe = applyAffine(cameraFit.affine, 0.42, 0.67), expectedProbe = applyAffine(cameraMove, 0.42, 0.67);
  check('camera motion fit rejects moving-player outliers', cameraFit.inliers.length === staticPts.length && Math.hypot(fitProbe[0] - expectedProbe[0], fitProbe[1] - expectedProbe[1]) < 1e-6);
  const movedCal = calibrationFromTransform(cal, cameraMove);
  const oldNet = applyH(cal.toImg, 10, 22), movedNet = applyH(movedCal.toImg, 10, 22), expectedNet = applyAffine(cameraMove, ...oldNet);
  check('camera motion carries court calibration', Math.hypot(movedNet[0] - expectedNet[0], movedNet[1] - expectedNet[1]) < 1e-6, movedNet.map(v => v.toFixed(3)).join(','));

  // portrait/short-form footage: missing court corners can be placed outside the video frame
  const portraitView = calibrationWorkspace(1080, 1920);
  const outsideImage = [-0.8, 1.15];
  const outsideCanvas = imageToCalibrationCanvas(portraitView, ...outsideImage);
  const outsideBack = calibrationCanvasToImage(portraitView, ...outsideCanvas);
  const portraitFrameRatio = portraitView.frame.w / portraitView.frame.h;
  check('portrait calibration workspace has out-of-frame margins', portraitView.portrait && portraitView.width <= 1280 && portraitView.height <= 900 && outsideCanvas[0] >= 0 && outsideCanvas[0] <= portraitView.width && outsideCanvas[1] >= 0 && outsideCanvas[1] <= portraitView.height && Math.abs(portraitFrameRatio - 1080 / 1920) < 1e-9,
    `${portraitView.width}×${portraitView.height}, frame ${portraitView.frame.w.toFixed(0)}×${portraitView.frame.h.toFixed(0)}`);
  check('out-of-frame calibration coordinate round-trip', Math.abs(outsideBack[0] - outsideImage[0]) < 1e-9 && Math.abs(outsideBack[1] - outsideImage[1]) < 1e-9, outsideBack.map(v => v.toFixed(2)).join(','));
  const portraitCal = makeCalibration([[-0.6, 0.18], [1.6, 0.18], [1.3, 1.08], [-0.3, 1.08]]);
  const portraitCorner = applyH(portraitCal.toImg, 0, 44);
  check('homography supports court corners outside video', Math.abs(portraitCorner[0] + 0.3) < 1e-6 && Math.abs(portraitCorner[1] - 1.08) < 1e-6, portraitCorner.map(v => v.toFixed(2)).join(','));
  const portraitPreview = containSize(1080, 1920, { maxWidth: 1280, maxHeight: 900 });
  check('portrait preview is contained by width and height', portraitPreview.width <= 1280 && portraitPreview.height <= 900 && Math.abs(portraitPreview.width / portraitPreview.height - 1080 / 1920) < 0.002, `${portraitPreview.width}×${portraitPreview.height}`);
  const portraitStage = document.createElement('div');
  setMediaLayout(portraitStage, 1080, 1920);
  check('portrait stage gets viewport-height layout', portraitStage.classList.contains('portrait-media') && portraitStage.style.aspectRatio === '1080 / 1920' && portraitStage.style.getPropertyValue('--portrait-max-width').endsWith('vh'), portraitStage.style.getPropertyValue('--portrait-max-width'));

  const players = [
    { team: 'A', label: 'Me', isMe: true }, { team: 'A', label: 'Partner' },
    { team: 'B', label: 'Opp 1' }, { team: 'B', label: 'Opp 2' },
  ];
  const fps = 10, dur = 150;
  // shot schedule: rallies every 18 s; 9 shots alternating teams, 1.6 s apart
  const shots = [];
  for (let r0 = 2; r0 < dur - 18; r0 += 18) {
    for (let n = 0; n < 9; n++) {
      const team = n % 2 === 0 ? 'A' : 'B';
      const slot = team === 'A' ? (n % 4 === 0 ? 0 : 1) : (n % 4 === 1 ? 2 : 3);
      shots.push({ t: r0 + n * 1.6, slot, r0 });
    }
  }
  // positions: "Me" (slot 0) is slow to the kitchen; opponents get there fast
  function pos(k, t) {
    const r = shots.filter(s => s.t <= t + 0.01).pop();
    const r0 = r ? r.r0 : 0, dt = t - r0;
    const x = [5, 15, 5, 15][k] + Math.sin(t * 0.7 + k) * 1.5;
    let d; // distance from net
    if (k < 2) d = dt < 3.6 ? 21 : Math.max(8, 21 - (dt - 3.6) * (k === 0 ? 2.2 : 6)); // serving team
    else d = k === 2 ? (dt < 1.6 ? 21 : Math.max(8, 21 - (dt - 1.6) * 9)) : 8;
    if (dt > 16) d = 21;
    const y = k < 2 ? 22 + d : 22 - d;
    return [x, y];
  }
  function landmarks(k, t) {
    const [x, y] = pos(k, t);
    const [fx, fy] = applyH(cal.toImg, x, y);
    const h = 0.10 + 0.14 * (y / 44); // apparent height
    const lm = new Float32Array(99);
    const set = (i, dx, dy) => { lm[i * 3] = fx + dx * h; lm[i * 3 + 1] = fy - dy * h; lm[i * 3 + 2] = 0.95; };
    const kneeBend = k === 0 ? 0.0 : 0.06; // "Me" stands tall
    set(0, 0, 0.95); set(11, -0.12, 0.8); set(12, 0.12, 0.8);
    set(13, -0.18, 0.62); set(14, 0.18, 0.62);
    set(23, -0.08, 0.5 - kneeBend); set(24, 0.08, 0.5 - kneeBend);
    set(25, -0.1, 0.27); set(26, 0.1, 0.27);
    set(27, -0.12, 0.02); set(28, 0.12, 0.02); set(29, -0.12, 0); set(30, 0.12, 0); set(31, -0.1, 0); set(32, 0.1, 0);
    // wrists: paddle low for "Me", swing burst near own shots
    let rwx = 0.22, rwy = k === 0 ? 0.40 : 0.62;
    const mine = shots.find(s => s.slot === k && Math.abs(s.t - t) < 0.25);
    if (mine) { const ph = (t - mine.t) / 0.25; rwx += 0.35 * Math.cos(ph * Math.PI); rwy += 0.15 * Math.sin(ph * Math.PI); }
    set(16, rwx, rwy); set(15, -0.2, 0.55);
    set(19, -0.2, 0.55); set(20, rwx, rwy);
    return lm;
  }
  const samples = [];
  for (let i = 0; i <= dur * fps; i++) {
    const t = i / fps;
    samples.push({ t, p: players.map((_, k) => { const [cx, cy] = pos(k, t); return { lm: landmarks(k, t), cx, cy, conf: 0.9 }; }), b: null });
  }
  const match = {
    id: 'test', name: 'synthetic', createdAt: Date.now(),
    cfg: { format: 'doubles', skill: '3.5', myTeam: 'A', fps, sensitivity: 3.5 },
    players, cal, samples, outcomes: {}, video: { name: 'x', size: 1, duration: dur, w: 1920, h: 1080 },
  };

  const t0 = performance.now();
  let A = analyze(match);
  check('analyze runs', true, `${(performance.now() - t0).toFixed(0)} ms for ${samples.length} samples`);
  const expectedRallies = Math.floor((dur - 18 - 2) / 18) + 1;
  check('rallies detected', A.rallies.length === expectedRallies, `${A.rallies.length} (expected ${expectedRallies})`);
  check('shots detected', Math.abs(A.shots.length - shots.length) <= 2, `${A.shots.length} (expected ${shots.length})`);
  check('first shot is serve', A.shots[0]?.type === 'Serve', A.shots.slice(0, 4).map(s => s.type).join(', '));
  check('handedness right', A.handed.every(h => h === 'R'), A.handed.join(''));
  const me = A.metrics[0], p2 = A.metrics[1];
  check('Me slower to kitchen than partner', median(me.arrivalThird) > median(p2.arrivalThird), `${median(me.arrivalThird).toFixed(2)}s vs ${median(p2.arrivalThird).toFixed(2)}s`);
  check('Me paddle low', me.paddleLowPct > 0.8, `${(me.paddleLowPct * 100).toFixed(0)}%`);
  check('Partner paddle up', p2.paddleLowPct < 0.2, `${(p2.paddleLowPct * 100).toFixed(0)}%`);

  // label outcomes: team B wins every other rally via "Me" error
  A.rallies.forEach((r, i) => { match.outcomes[r.id] = i % 2 ? { winner: 'B', how: 'error', by: 0 } : { winner: 'A', how: 'winner', by: 1 }; });
  A = analyze(match);
  const C = coach(match, A);
  check('outcomes applied', A.team.A.labeled === A.rallies.length, `won ${A.team.A.won} lost ${A.team.A.lost}`);
  check('findings generated', C.findings.length > 0, C.findings.map(f => `${f.who}: ${f.ruleId}(${f.severity})`).join('; '));
  check('paddle_low flagged for Me', C.findings.some(f => f.ruleId === 'paddle_low' && f.slot === 0));
  check('lens split', C.findings.some(f => f.lens === 'fix'), `fix=${C.findings.filter(f => f.lens === 'fix').length} exploit=${C.findings.filter(f => f.lens === 'exploit').length}`);
  const plan = buildPlan(C, match);
  check('plan has 7 days', plan.days.length === 7, plan.days[0].items.map(i => i.name).join(', '));
  const json = matchToJSON(match);
  const back2 = matchFromJSON(json);
  check('json round-trip', back2.samples[5].p[0].lm instanceof Float32Array && back2.samples.length === samples.length, `${(json.length / 1e6).toFixed(1)} MB`);
  // ---- players outside the court lines
  const courtMod = await import('../js/court.js');
  const { filterDetections } = await import('../js/tracking.js');
  const fake = (cx, cy) => ({ cx, cy, conf: 0.9, lm: new Float32Array(99) });
  const outsideDets = [fake(10, 62), fake(-14, 30), fake(10, 30)]; // 18 ft behind baseline, 14 ft outside sideline, on court
  check('standard area drops far-out players', filterDetections(outsideDets, courtMod.AREA_PRESETS.standard).length === 1);
  check('wide area keeps players outside the lines', filterDetections(outsideDets, courtMod.AREA_PRESETS.xwide).length === 3);
  check('default (no limit) keeps everyone on the ground', filterDetections([...outsideDets, fake(40, 90)]).length === 4);
  // ---- eraser (ignore zones)
  const maskMod = await import('../js/mask.js');
  const grid = maskMod.toGrid(maskMod.emptyMask());
  maskMod.paint(grid, 0.9, 0.5, 0.05, 1, 16 / 9);               // erase a spot on the right edge (spectators)
  const spectator = new Float32Array(99), player = new Float32Array(99);
  for (const [lm, x] of [[spectator, 0.9], [player, 0.5]]) {
    for (const j of [23, 24]) { lm[j * 3] = x; lm[j * 3 + 1] = 0.45; lm[j * 3 + 2] = 0.9; }
    for (const j of [27, 28]) { lm[j * 3] = x; lm[j * 3 + 1] = 0.52; lm[j * 3 + 2] = 0.9; }
  }
  check('eraser hides people in erased area only', maskMod.poseMasked(grid, spectator) && !maskMod.poseMasked(grid, player));
  const round = maskMod.toGrid(maskMod.fromGrid(grid));
  check('erased areas save/restore', round.g.every((v, i) => v === grid.g[i]) && maskMod.fromGrid(grid).cells.length > 0, `${maskMod.fromGrid(grid).cells.length} cells`);
  const { Tracker: TrackerE } = await import('../js/tracking.js');
  const trE = new TrackerE([{ team: 'A', label: 'P' }]);
  const outE = trE.update(0, [{ cx: 10, cy: 40, masked: true }]);
  const outE2 = trE.update(5, [{ cx: 10, cy: 40, masked: true }, { cx: 12, cy: 35 }]);
  check('tracker never starts a player on an erased spectator', outE[0] === null && outE2[0]?.cx === 12);
  const trF = new TrackerE([{ team: 'A', label: 'P' }]);
  trF.update(10, [{ cx: 10, cy: 40 }]);
  const stepIn = trF.update(10.1, [{ cx: 10.5, cy: 40.5, masked: true }]);
  check('tracked player stepping into an erased area is kept', stepIn[0]?.cx === 10.5);

  const { thoroughRegions } = await import('../js/detector.js');
  const tiles = thoroughRegions(cal, 1920, 1080);
  const farTiles = tiles.slice(0, 2);
  check('calibration zoom tiles for far players', tiles.length === 3 && farTiles.every(r => r.sw < 1920 * 0.75 && r.sh < 1080 * 0.7 && r.sx >= 0 && r.sy >= 0 && r.sx + r.sw <= 1920 && r.sy + r.sh <= 1080) && farTiles[0].sx + farTiles[0].sw > farTiles[1].sx,
    tiles.map(r => `${r.sw}x${r.sh}@${r.sx},${r.sy}`).join(' | '));
  match.players[0].hand = 'L';
  const Ahand = analyze(match);
  check('calibrated paddle hand overrides detection', Ahand.handed[0] === 'L' && Ahand.handed[1] === 'R', Ahand.handed.join(''));
  delete match.players[0].hand;
  const above = courtMod.imageToCourt(cal, 0.5, 0.05); // above the far baseline, near the horizon / sky
  const feet = courtMod.imageToCourt(cal, 0.5, 0.97);  // just below the near baseline
  check('ground-plane check', feet && feet[1] > 44 && (above === null || above[1] < -20), `feet → y=${feet?.[1].toFixed(1)} ft; top of frame → ${above ? 'y=' + above[1].toFixed(0) + ' ft' : 'not on ground'}`);
  const regs = courtMod.cropRegions(cal, 1920, 1080, courtMod.AREA_PRESETS.xwide);
  check('crop regions valid for very wide area', regs.length === 2 && regs.every(r => r.sx >= 0 && r.sy >= 0 && r.sx + r.sw <= 1920 && r.sy + r.sh <= 1080 && r.sw > 100 && r.sh > 50), regs.map(r => `${r.sw}x${r.sh}`).join(', '));

  // ---- accuracy (game review)
  const { computeAccuracy, decisiveOutcome } = await import('../js/accuracy.js');
  const R = computeAccuracy(match, A);
  check('every shot rated', R.review.length === A.shots.length && R.review.every(x => x.score >= 0 && x.score <= 100));
  const accMe = R.perPlayer[0].accuracy, accP = R.perPlayer[1].accuracy;
  check('errors count as blunders', R.perPlayer[0].counts.blunder >= 4, `Me blunders: ${R.perPlayer[0].counts.blunder}`);
  check('winner rated brilliant', R.perPlayer[1].counts.brilliant >= 1, `Partner brilliant: ${R.perPlayer[1].counts.brilliant}`);
  check('accuracy: error-prone player lower', accMe < accP, `Me ${accMe.toFixed(1)}% vs Partner ${accP.toFixed(1)}%; all: ${R.perPlayer.map(p => p.accuracy.toFixed(0)).join(' / ')}`);
  const winnerRally = A.rallies.find(r => r.outcome?.how === 'winner');
  const savedBy = winnerRally.outcome.by;
  winnerRally.outcome.by = String(savedBy); // imported/older matches can store this as text
  const stringWinner = decisiveOutcome(winnerRally, winnerRally.outcome, A.shots, players);
  const Rstring = computeAccuracy(match, A);
  check('text player id still credits the winning shot', stringWinner?.slot === savedBy && Rstring.review[stringWinner.j].score === 100 && Rstring.review[stringWinner.j].cls === 'brilliant');
  winnerRally.outcome.by = -1;
  const inferredWinner = decisiveOutcome(winnerRally, winnerRally.outcome, A.shots, players);
  check('missing winner player falls back to winning team last shot', inferredWinner && players[inferredWinner.slot].team === winnerRally.outcome.winner && computeAccuracy(match, A).review[inferredWinner.j].score === 100);
  winnerRally.outcome.by = savedBy;
  const savedOutcome = winnerRally.outcome;
  winnerRally.outcome = null;
  const neutralR = computeAccuracy(match, A);
  const finalJ = winnerRally.shots.at(-1);
  check('unlabeled final shot is not called a mistake', neutralR.review[finalJ].score >= 74 && !['mistake', 'blunder'].includes(neutralR.review[finalJ].cls));
  winnerRally.outcome = savedOutcome;

  // ---- player calibration: partners in different shirts cross paths; identities must survive
  const { Tracker } = await import('../js/tracking.js');
  const RED = [200, 40, 40], BLUE = [40, 60, 200];
  const tr = new Tracker([
    { team: 'A', label: 'Red', color: RED, seed: { cx: 5, cy: 30 } },
    { team: 'A', label: 'Blue', color: BLUE, seed: { cx: 15, cy: 30 } },
  ]);
  let swapped = false;
  for (let i = 0; i <= 30; i++) {
    const t = i / 10, f = i / 30;
    const red = { cx: 5 + 10 * f, cy: 30, color: RED }, blue = { cx: 15 - 10 * f, cy: 30.5, color: BLUE };
    const dets = i % 2 ? [red, blue] : [blue, red];
    const out = tr.update(t, i === 15 ? [blue] : dets); // red hidden at the crossing point
    if (out[0] && out[0].color !== RED) swapped = true;
    if (out[1] && out[1].color !== BLUE) swapped = true;
  }
  check('calibrated tracker keeps identities when partners cross', !swapped);
  // A greedy closest-pair match swaps these players: Q->P is locally cheapest,
  // but P->P plus Q->Q is the better assignment for the pair as a whole.
  const trRotate = new Tracker([{ team: 'A', label: 'P' }, { team: 'A', label: 'Q' }]);
  trRotate.update(0, [{ id: 'P', cx: 0, cy: 35, conf: 0.9 }, { id: 'Q', cx: 4, cy: 35, conf: 0.9 }]);
  const rotated = trRotate.update(0.4, [{ id: 'P', cx: 3, cy: 35, conf: 0.9 }, { id: 'Q', cx: 8, cy: 35, conf: 0.9 }]);
  check('team-wide assignment keeps identities during rotation', rotated[0]?.id === 'P' && rotated[1]?.id === 'Q', rotated.map(x => x?.id || 'missing').join(' / '));
  const seedBox = (cx, cy) => ({ x0: cx / 40, x1: cx / 40 + 0.04, y0: cy / 60, y1: cy / 60 + 0.12 });
  const trSeed = new Tracker([
    { team: 'A', label: 'Me', seed: { cx: 5, cy: 35, box: seedBox(5, 35) } },
    { team: 'A', label: 'Partner', seed: { cx: 15, cy: 35, box: seedBox(15, 35) } },
    { team: 'B', label: 'Opp 1', seed: { cx: 5, cy: 9, box: seedBox(5, 9) } },
    { team: 'B', label: 'Opp 2', seed: { cx: 15, cy: 9, box: seedBox(15, 9) } },
  ]);
  const seedOut = trSeed.update(0, [{ id: 'O1', cx: 5, cy: 9, conf: 0.9 }, { id: 'O2', cx: 15, cy: 9, conf: 0.9 }]);
  const seedTargets = trSeed.followTargets(0, seedOut);
  const meTarget = seedTargets.find(x => x.si === 0), partnerTarget = seedTargets.find(x => x.si === 1);
  const meClaimed = trSeed.claim(0, 0, { id: 'Me', cx: 5, cy: 35, conf: 0.9, box: seedBox(5, 35) }, seedOut);
  const partnerClaimed = trSeed.claim(1, 0, { id: 'Partner', cx: 15, cy: 35, conf: 0.9, box: seedBox(15, 35) }, seedOut);
  check('calibration boxes acquire players missed by regular detection', seedOut[2]?.id === 'O1' && seedOut[3]?.id === 'O2' && meTarget && partnerTarget && meClaimed && partnerClaimed && seedOut[0]?.id === 'Me' && seedOut[1]?.id === 'Partner');
  const trMovingSeed = new Tracker([{ team: 'A', label: 'Me', seed: { cx: 5, cy: 35, box: seedBox(5, 35) } }]);
  trMovingSeed.setCameraTransform(cameraMove);
  const movingTarget = trMovingSeed.followTargets(0, [null])[0];
  const originalCentre = [(seedBox(5, 35).x0 + seedBox(5, 35).x1) / 2, (seedBox(5, 35).y0 + seedBox(5, 35).y1) / 2];
  const movedSeedBox = trMovingSeed.cameraBox(seedBox(5, 35));
  const targetCentre = [(movedSeedBox.x0 + movedSeedBox.x1) / 2, (movedSeedBox.y0 + movedSeedBox.y1) / 2];
  const movedCentre = applyAffine(cameraMove, ...originalCentre);
  check('camera motion carries saved player calibration boxes', Math.hypot(targetCentre[0] - movedCentre[0], targetCentre[1] - movedCentre[1]) < 1e-9 && movedCentre[0] > movingTarget.box.x0 && movedCentre[0] < movingTarget.box.x1 && movedCentre[1] > movingTarget.box.y0 && movedCentre[1] < movingTarget.box.y1);
  const tr2 = new Tracker([{ team: 'A', label: 'x', seed: { cx: 15, cy: 30 }, color: RED }, { team: 'A', label: 'y', seed: { cx: 5, cy: 30 }, color: BLUE }]);
  const o2 = tr2.update(0, [{ cx: 5, cy: 30, color: BLUE }, { cx: 15, cy: 30, color: RED }]);
  check('seeded init assigns by calibration', o2[0]?.color === RED && o2[1]?.color === BLUE);

  // ---- skeleton following: same shirts, partners cross diagonally — identity from movement alone
  const GREY = [128, 128, 128];
  const box = (cx, cy) => ({ x0: cx / 40, x1: cx / 40 + 0.03, y0: cy / 60, y1: cy / 60 + 0.1 });
  const trS = new Tracker([
    { team: 'A', label: 'L', color: GREY, seed: { cx: 4, cy: 28, box: box(4, 28) } },
    { team: 'A', label: 'R', color: GREY, seed: { cx: 16, cy: 34, box: box(16, 34) } },
  ]);
  let swapS = false;
  for (let i = 0; i <= 40; i++) {
    const t = i / 10, f = i / 40;
    const a = { id: 'L', cx: 4 + 12 * f, cy: 28 + 6 * f, color: GREY }, b = { id: 'R', cx: 16 - 12 * f, cy: 34 - 6 * f, color: GREY };
    a.box = box(a.cx, a.cy); b.box = box(b.cx, b.cy);
    const out = trS.update(t, i >= 19 && i <= 21 ? [i % 2 ? a : b] : i % 2 ? [a, b] : [b, a]); // one hidden behind the other at the crossing
    if (i >= 19 && i <= 21) continue; // standing on the same spot: either label is right
    if (out[0] && out[0].id !== 'L') swapS = true;
    if (out[1] && out[1].id !== 'R') swapS = true;
  }
  check('skeleton tracker keeps identities when same-shirt partners cross', !swapS);
  // follow look: a missed player is found again near their last skeleton, never the partner
  const trF2 = new Tracker([{ team: 'A', label: 'P', seed: { cx: 10, cy: 35, box: box(10, 35) } }, { team: 'A', label: 'Q', seed: { cx: 4, cy: 35, box: box(4, 35) } }]);
  trF2.update(0, [{ cx: 10, cy: 35, box: box(10, 35) }, { cx: 4, cy: 35, box: box(4, 35) }]);
  const miss = trF2.update(0.1, [{ cx: 4.2, cy: 35, box: box(4.2, 35) }]);
  const targets = trF2.followTargets(0.1, miss);
  const partnerClaim = trF2.claim(0, 0.1, { cx: 4.3, cy: 35, box: box(4.2, 35) }, miss);
  const okClaim = trF2.claim(0, 0.1, { cx: 10.3, cy: 35.2, box: box(10.3, 35.2) }, miss);
  check('follow look recovers a missed player, not the partner', targets.length === 1 && targets[0].si === 0 && !partnerClaim && okClaim && miss[0].cx === 10.3);
  // stale tracks must not jump to seated/standing people well outside the sidelines
  const trSide = new Tracker([{ team: 'A', label: 'Player', color: GREY, seed: { cx: 8, cy: 35, box: box(8, 35) } }]);
  trSide.update(0, [{ cx: 8, cy: 35, color: GREY, box: box(8, 35) }]);
  trSide.update(0.1, []);
  const stoleLeft = trSide.update(2, [{ cx: -7, cy: 35, color: GREY, box: box(-7, 35) }]);
  const trSideR = new Tracker([{ team: 'A', label: 'Player', color: GREY, seed: { cx: 12, cy: 35, box: box(12, 35) } }]);
  trSideR.update(0, [{ cx: 12, cy: 35, color: GREY, box: box(12, 35) }]);
  trSideR.update(0.1, []);
  const stoleRight = trSideR.update(2, [{ cx: 27, cy: 35, color: GREY, box: box(27, 35) }]);
  check('stale track rejects left/right sideline spectators', stoleLeft[0] === null && stoleRight[0] === null);
  const foundAgain = trSide.update(2.1, [{ cx: 11, cy: 35, color: GREY, box: box(11, 35) }]);
  check('stale track can reacquire the player near the court', foundAgain[0]?.cx === 11);
  // A genuine player may still run out wide when their motion is continuous frame to frame.
  const trWide = new Tracker([{ team: 'A', label: 'Wide', seed: { cx: 1, cy: 35, box: box(1, 35) } }]);
  let wide = null;
  for (let i = 0; i <= 6; i++) {
    const cx = 1 - i;
    wide = trWide.update(i / 10, [{ cx, cy: 35, box: box(cx, 35) }]);
  }
  check('continuously tracked player may run outside the sideline', wide[0]?.cx === -5);
  // processing starts at the calibration frame, then goes back to the start
  const { frameTimes, processingOrder } = await import('../js/processor.js');
  const ft = frameTimes([{ start: 0, end: 2 }, { start: 5, end: 6 }], 0.5);
  const po = processingOrder(ft, 1.0);
  check('tracking runs forward and backward from the calibration frame', ft.length === 8 && ft[po.forward[0]].t === 1 && po.backward.map(i => ft[i].t).join() === '0.5,0' && po.forward.length + po.backward.length === ft.length, `fwd ${po.forward.map(i => ft[i].t).join(',')} | back ${po.backward.map(i => ft[i].t).join(',')}`);

  // ---- coach callouts
  const { buildCallouts, activeCallouts } = await import('../js/callouts.js');
  const CO = buildCallouts(match, A);
  const perSlotOverlap = CO.some((c, i) => CO.some((d, j) => j > i && d.slot === c.slot && d.t0 < c.t1 && d.t1 > c.t0));
  check('coach callouts generated, one per player at a time', CO.length > 5 && !perSlotOverlap, `${CO.length} callouts; e.g. ${[...new Set(CO.map(c => c.text))].slice(0, 5).join(' | ')}`);
  check('callouts tell the slow player to get to the kitchen', CO.some(c => c.slot === 0 && /kitchen|Move up/.test(c.text)));
  const c0 = CO[0];
  check('callouts appear only at their moment', activeCallouts(CO, c0.t0 + 0.1, match.players).includes(c0) && !activeCallouts(CO, c0.t1 + 0.5, match.players).includes(c0) && activeCallouts(CO, c0.t0 + 0.1, match.players, match.players[c0.slot].team === 'A' ? 'B' : 'A').every(c => match.players[c.slot].team !== match.players[c0.slot].team));

  // ---- ball calibration on synthetic frames
  const { BallDetector, sampleBallColor, ballConfigFromSamples } = await import('../js/ball.js');
  const W = 1280, H = 720;
  const frame = (bx, by) => {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#2e5e8a'; g.fillRect(0, 0, W, H);                 // blue court
    g.fillStyle = '#e8e23a'; g.fillRect(600, 400, 40, 40);            // static yellow sign (not moving)
    g.fillStyle = '#e8e23a'; g.fillRect(200 + bx / 4, 450, 60, 90);   // moving yellow shirt (too big)
    g.fillStyle = '#d9f23d'; g.beginPath(); g.arc(bx, by, 6, 0, 7); g.fill(); // ball, 12 px
    return c;
  };
  const f1 = frame(500, 300), f2 = frame(540, 290);
  const patch = f2.getContext('2d').getImageData(540 - 8, 290 - 8, 16, 16).data;
  const col = sampleBallColor(patch, 16, 6);
  check('ball colour sampled', col && col.s > 0.5, col ? `hue ${col.h.toFixed(0)}°, s ${col.s.toFixed(2)}` : 'none');
  const bcfg = ballConfigFromSamples([{ ...col, d: 12 }]);
  const calB = makeCalibration([[0.2, 0.1], [0.8, 0.1], [0.95, 0.95], [0.05, 0.95]]);
  const bd = new BallDetector(W, H, calB, bcfg);
  bd.detect(f1, 0);
  const res = bd.detect(f2, 0.1, true);
  const okPos = res.pick && Math.abs(res.pick[0] * W - 540) < 4 && Math.abs(res.pick[1] * H - 290) < 4;
  check('calibrated ball detector finds ball, ignores sign & shirt', okPos && res.blobs.length === 1, res.pick ? `(${(res.pick[0] * W).toFixed(0)}, ${(res.pick[1] * H).toFixed(0)}), ${res.blobs.length} blob(s)` : `none, ${res.blobs.length} blobs`);

  log.push('', 'SUMMARY: ' + C.summary.replace(/<[^>]+>/g, ''));
  // store for the UI smoke test (open index.html#open=selftest)
  if (location.search.includes('store')) {
    const { saveMatch } = await import('../js/db.js');
    match.id = 'selftest'; match.name = 'Synthetic self-test match';
    await saveMatch(match, { id: 'selftest', name: match.name, createdAt: match.createdAt, duration: A.duration, format: 'doubles', skill: '3.5', rallies: A.rallies.length, shots: A.shots.length, me: 'Me', topFix: [], topExploit: [], key: {} });
    log.push('STORED selftest match');
  }
} catch (e) {
  log.push('FAIL exception — ' + e.stack);
}
function median(a) { const v = a.map(e => e.dt).sort((x, y) => x - y); return v[v.length >> 1]; }
out.textContent = log.join('\n');
document.title = log.some(l => l.startsWith('FAIL')) ? 'FAILED' : 'PASSED';
</script>
</body></html>
